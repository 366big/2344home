function cursorFrame(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;cursorDot.style.left=mx+"px";cursorDot.style.top=my+"px";cursorRing.style.left=rx+"px";cursorRing.style.top=ry+"px";requestAnimationFrame(cursorFrame)}cursorFrame();

function setLang(k){
 current=T[k]?k:"en"; document.documentElement.lang=current; document.documentElement.dir=current==="ar"?"rtl":"ltr"; sel.value=current;
