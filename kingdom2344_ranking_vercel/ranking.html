let current="en";
const sel=document.getElementById("language");
LANGS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;sel.appendChild(o)});
function tr(k){return (T[current]||T.en)[k]||T.en[k]||k}
function setLang(k){
 current=T[k]?k:"en"; document.documentElement.lang=current; document.documentElement.dir=current==="ar"?"rtl":"ltr"; sel.value=current;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=tr(e.dataset.i18n));
 renderLast();
 localStorage.setItem("kingdom2344_lang",current);
}
let rows=[];
function renderLast(){
 const wrap=document.getElementById("tableWrap");
 if(!rows.length)return;
 wrap.innerHTML='<table class="table"><thead><tr><th>'+tr("rank")+'</th><th>'+tr("player")+'</th><th>'+tr("alliance")+'</th><th class="score">'+tr("score")+'</th></tr></thead><tbody>'+

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
 try{

  if(!res.ok)throw new Error(data.error||"API error");
  rows=data.rows||[];
  renderLast();
  document.getElementById("status").textContent=tr("updated")+(data.cachedAt?": "+new Date(data.cachedAt).toLocaleString():"");
 }catch(e){
