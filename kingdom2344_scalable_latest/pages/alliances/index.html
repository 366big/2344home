<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliances · Kingdom 2344</title>
<style>
:root{
  --bg:#050a0c;
  --line:rgba(226,196,139,.28);
  --gold:#e2c48b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 8%,rgba(35,52,55,.28),transparent 42%),
    linear-gradient(180deg,#071013 0%,#030709 100%);
  color:#eee;
  font-family:Georgia,"Times New Roman",serif;
}
.nav{
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid var(--line);
  background:rgba(4,9,11,.92);
  backdrop-filter:blur(14px);
}
.navin{
  max-width:1500px;
  min-height:72px;
  margin:auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.brand{
  color:#ead5a8;
  text-decoration:none;
  font-size:18px;
  letter-spacing:4px;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:4px;
  font-size:7px;
  letter-spacing:3px;
  color:rgba(234,213,168,.55);
}
.links{
  display:flex;
  gap:28px;
}
.links a{
  color:rgba(239,232,215,.72);
  text-decoration:none;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.25s ease;
}
.links a:hover,.links a.active{color:#f1d49a}
main{
  max-width:1500px;
  margin:auto;
  padding:70px 34px 100px;
}
.heading{
  text-align:center;
  margin-bottom:52px;
}
.eyebrow{
  color:rgba(226,196,139,.62);
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:13px;
}
h1{
  margin:0;
  color:#ead5a8;
  font-size:clamp(34px,4vw,54px);
  font-weight:400;
  letter-spacing:8px;
  text-transform:uppercase;
}
.rule{
  width:90px;
  height:1px;
  margin:20px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.cards{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:26px;
  align-items:start;
}
.card{
  position:relative;
  display:block;
  overflow:hidden;
  text-decoration:none;
  border:1px solid rgba(226,196,139,.22);
  background:#05090b;
  box-shadow:0 18px 50px rgba(0,0,0,.48);
  transition:transform .38s ease,box-shadow .38s ease,border-color .38s ease;
}
.card:nth-child(1){grid-column:1 / span 2}
.card:nth-child(2){grid-column:3 / span 2}
.card:nth-child(3){grid-column:5 / span 2}
.card:nth-child(4){grid-column:2 / span 2}
.card:nth-child(5){grid-column:4 / span 2}
.card img{
  display:block;
  width:100%;
  height:auto;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,transparent 70%,rgba(0,0,0,.12));
  transition:.35s ease;
}
.card:hover{
  transform:translateY(-8px);
  border-color:rgba(226,196,139,.62);
  box-shadow:0 28px 65px rgba(0,0,0,.68),0 0 30px rgba(226,196,139,.08);
}
.card:hover::after{background:rgba(255,255,255,.025)}
@media(max-width:1000px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card:nth-child(n){grid-column:auto}
  .card:nth-child(5){grid-column:1 / span 2;max-width:50%;margin:auto}
}
@media(max-width:680px){
  .navin{padding:14px 16px;flex-direction:column}
  .links{gap:14px;flex-wrap:wrap;justify-content:center}
  main{padding:42px 16px 70px}
  .cards{grid-template-columns:1fr;gap:18px}
  .card:nth-child(n){grid-column:auto;max-width:none;margin:0}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="navin">
    <a class="brand" href="../../home.html">2344 <small>KINGDOM ARCHIVE</small></a>
    <div class="links">
      <a href="../../home.html">Home</a>
      <a href="../kingdom/">Kingdom</a>
      <a class="active" href="./">Alliances</a>
      <a href="../rankings/">Ranking</a>
      <a href="../migration/">Migration</a>
    </div>
  </div>
</nav>

<main>
  <header class="heading">
    <div class="eyebrow">Kingdom 2344 · Royal Archive</div>
    <h1>Alliances</h1>
    <div class="rule"></div>
  </header>

  <section class="cards" aria-label="Kingdom 2344 Alliances">
    <a class="card" href="?alliance=SUN"><img src="../../assets/images/SUN.png" alt="SUN"></a>
    <a class="card" href="?alliance=VIP"><img src="../../assets/images/VIP.png" alt="VIP"></a>
    <a class="card" href="?alliance=ZZZ"><img src="../../assets/images/ZZZ.png" alt="ZZZ"></a>
    <a class="card" href="?alliance=FIL"><img src="../../assets/images/FIL.png" alt="FIL"></a>
    <a class="card" href="?alliance=ODI"><img src="../../assets/images/ODI.png" alt="ODI"></a>
  </section>
</main>
</body>
</html>
